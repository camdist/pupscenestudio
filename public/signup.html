<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6d7c7"><title>Create account — PupScene Studio</title><link rel="icon" href="assets/favicon-32.png"><link rel="stylesheet" href="assets/account.css"></head><body><main class="loginbox"><img class="logo" src="assets/app-logo.webp" alt="PupScene Studio"><h1>Create your PupScene account.</h1><p class="muted">Start with the Free plan: 1 storyboard generation per day.</p><div id="msg" class="notice hidden"></div><div class="field"><label for="name">Account name</label><input id="name" autocomplete="name" placeholder="Your name"></div><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><div style="display:flex;gap:8px"><input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters"><button class="btn" id="showPass" type="button" style="flex:0 0 auto">Show</button></div></div><button class="btn primary" id="signupBtn" style="width:100%;margin-top:10px">Create Free Account</button><p style="font-size:12px;color:#777;margin-top:18px">Already have an account? <a id="loginLink" href="login.html">Log in</a>.</p></main><script>
const $=x=>document.getElementById(x),msg=$('msg'),params=new URLSearchParams(location.search),next=params.get('next')||'index.html';$('loginLink').href='login.html?next='+encodeURIComponent(next);function say(t,bad=false){msg.textContent=t;msg.classList.remove('hidden');msg.classList.toggle('error',bad)}function friendly(code){return({invalid_email:'Enter a valid email address.',name_required:'Please enter your name.',password_too_short:'Use at least 8 characters.',account_exists:'An account already exists for that email. Please log in instead.',admin_email_reserved:'The administrator email cannot be used on the public Sign Up page.',server_error:'PupScene could not create the account right now. Please try again.'})[code]||code||'Could not create account'}
$('signupBtn').onclick=async()=>{const name=$('name').value.trim(),email=$('email').value.trim().toLowerCase(),password=$('password').value;if(name.length<2)return say('Please enter your name.',true);if(!/^\S+@\S+\.\S+$/.test(email))return say('Enter a valid email address.',true);if(password.length<8)return say('Use at least 8 characters.',true);$('signupBtn').disabled=true;$('signupBtn').textContent='Creating account…';try{const r=await fetch('/api/auth/signup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,email,password})});const j=await r.json();if(!r.ok)throw new Error(friendly(j.error));say('Your Free account is ready. Opening PupScene…');setTimeout(()=>location.href=next,200)}catch(e){say(e.message,true)}finally{$('signupBtn').disabled=false;$('signupBtn').textContent='Create Free Account'}};$('showPass').onclick=()=>{const p=$('password'),show=p.type==='password';p.type=show?'text':'password';$('showPass').textContent=show?'Hide':'Show'};$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('signupBtn').click()});
</script></body></html>
