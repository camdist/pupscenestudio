<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6d7c7"><title>Sign in — PupScene Studio</title><link rel="icon" href="assets/favicon-32.png"><link rel="stylesheet" href="assets/account.css"></head><body><main class="loginbox"><img class="logo" src="assets/app-logo.webp" alt="PupScene Studio"><h1>Welcome back.</h1><p class="muted">Sign in with your email. We’ll send a six-digit code—no password to remember.</p><div id="msg" class="notice hidden"></div><div id="emailStep"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div id="turnstile"></div><button class="btn primary" id="send" style="width:100%;margin-top:10px">Send sign-in code</button></div><div id="codeStep" class="hidden"><div class="field"><label for="code">6-digit code</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456"></div><button class="btn primary" id="verify" style="width:100%">Verify & sign in</button><button class="btn" id="back" style="width:100%;margin-top:8px">Use another email</button></div><p style="font-size:11px;color:#777;margin-top:18px">Codes expire after 10 minutes. PupScene also rate-limits code requests to protect your account and email service.</p></main><script>
const $=x=>document.getElementById(x),msg=$('msg');const next=new URLSearchParams(location.search).get('next')||'index.html';let email='',turnstileToken='',widgetId=null;function say(t,bad=false){msg.textContent=t;msg.classList.remove('hidden');msg.classList.toggle('error',bad)}function friendlyError(code){return({verification_required:'Please complete the security check.',wait_before_retry:'Please wait about 1 minute before requesting another code.',email_rate_limited:'Too many code requests for this email. Please wait about 15 minutes and try again.',ip_rate_limited:'Too many sign-in requests from this connection. Please wait about 15 minutes and try again.',email_send_failed:'We could not send the sign-in email. Please try again shortly. If it continues, contact PupScene support.',email_service_not_configured:'PupScene email sign-in is not configured yet.',invalid_email:'Enter a valid email address.'})[code]||code||'Could not send code'}
async function setupTurnstile(){try{const c=await fetch('/api/security-config').then(r=>r.json());if(!c.turnstileSiteKey)return;const s=document.createElement('script');s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';s.async=true;s.onload=()=>{widgetId=turnstile.render('#turnstile',{sitekey:c.turnstileSiteKey,theme:'light',callback:t=>turnstileToken=t,'expired-callback':()=>turnstileToken=''})};document.head.appendChild(s)}catch(e){}}
$('send').onclick=async()=>{email=$('email').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email))return say('Enter a valid email address.',true);$('send').disabled=true;try{const r=await fetch('/api/auth/request-code',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,turnstileToken})});const j=await r.json();if(!r.ok)throw new Error(friendlyError(j.error));$('emailStep').classList.add('hidden');$('codeStep').classList.remove('hidden');say(j.devCode?'Development code: '+j.devCode:'Check your email for your PupScene sign-in code.')}catch(e){say(e.message,true);if(widgetId!==null&&window.turnstile)turnstile.reset(widgetId)}finally{$('send').disabled=false}};
$('verify').onclick=async()=>{const code=$('code').value.trim();if(!/^\d{6}$/.test(code))return say('Enter the 6-digit code.',true);$('verify').disabled=true;try{const r=await fetch('/api/auth/verify-code',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,code})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Sign-in failed');location.href=next}catch(e){say(e.message,true)}finally{$('verify').disabled=false}};$('back').onclick=()=>{$('codeStep').classList.add('hidden');$('emailStep').classList.remove('hidden');msg.classList.add('hidden')};setupTurnstile();
</script></body></html>
