<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6d7c7"><title>Log in — PupScene Studio</title><link rel="icon" href="assets/favicon-32.png"><link rel="stylesheet" href="assets/account.css"></head><body><main class="loginbox"><img class="logo" src="assets/app-logo.webp" alt="PupScene Studio"><h1>Welcome back.</h1><p class="muted">Log in to your existing PupScene account.</p><div id="msg" class="notice hidden"></div><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><div style="display:flex;gap:8px"><input id="password" type="password" autocomplete="current-password" placeholder="Your password"><button class="btn" id="showPass" type="button" style="flex:0 0 auto">Show</button></div></div><button class="btn primary" id="loginBtn" style="width:100%;margin-top:10px">Log in</button><p style="font-size:12px;color:#777;margin-top:18px">New to PupScene? <a id="signupLink" href="signup.html">Create a Free account</a>.</p><p style="font-size:11px;color:#888;margin-top:12px">Admin first login: use the configured admin email and the temporary password supplied by Campo Digital Studio, then change it immediately in Admin.</p></main><script>
const $=x=>document.getElementById(x),msg=$('msg'),params=new URLSearchParams(location.search),next=params.get('next')||'index.html';$('signupLink').href='signup.html?next='+encodeURIComponent(next);function say(t,bad=false){msg.textContent=t;msg.classList.remove('hidden');msg.classList.toggle('error',bad)}function friendly(code){return({invalid_email:'Enter a valid email address.',password_too_short:'Use at least 8 characters.',invalid_credentials:'That email or password does not match.',account_not_found:'No PupScene account was found for that email. Create an account first.',account_suspended:'This account is suspended. Please contact PupScene support.',account_recovery_required:'This older account needs account recovery. Please contact PupScene support.',admin_bootstrap_not_configured:'Admin first-login password is not configured in Cloudflare yet.',server_error:'PupScene could not sign you in right now. Please try again.'})[code]||code||'Could not sign in'}
$('loginBtn').onclick=async()=>{const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!/^\S+@\S+\.\S+$/.test(email))return say('Enter a valid email address.',true);if(password.length<8)return say('Use at least 8 characters.',true);$('loginBtn').disabled=true;$('loginBtn').textContent='Signing in…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok)throw new Error(friendly(j.error));say('Signed in. Opening PupScene…');setTimeout(()=>location.href=next,200)}catch(e){say(e.message,true)}finally{$('loginBtn').disabled=false;$('loginBtn').textContent='Log in'}};$('showPass').onclick=()=>{const p=$('password'),show=p.type==='password';p.type=show?'text':'password';$('showPass').textContent=show?'Hide':'Show'};$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
</script></body></html>
