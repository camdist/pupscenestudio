<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6d7c7"><title>Sign in — PupScene Studio</title><link rel="icon" href="assets/favicon-32.png"><link rel="stylesheet" href="assets/account.css"></head><body><main class="loginbox"><img class="logo" src="assets/app-logo.webp" alt="PupScene Studio"><h1>Welcome to PupScene.</h1><p class="muted">Enter your email and password. If the email is new, PupScene creates your Free account automatically.</p><div id="msg" class="notice hidden"></div><div class="field"><label for="name">Name <span style="font-weight:400;color:#777">(optional)</span></label><input id="name" autocomplete="name" placeholder="Your name"></div><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><div style="display:flex;gap:8px"><input id="password" type="password" autocomplete="current-password" placeholder="At least 8 characters"><button class="btn" id="showPass" type="button" style="flex:0 0 auto">Show</button></div></div><button class="btn primary" id="continueBtn" style="width:100%;margin-top:10px">Continue to PupScene</button><p style="font-size:11px;color:#777;margin-top:18px">New email? Your Free account is created automatically. Existing email? The same button signs you in.</p></main><script>
const $=x=>document.getElementById(x),msg=$('msg');const next=new URLSearchParams(location.search).get('next')||'index.html';function say(t,bad=false){msg.textContent=t;msg.classList.remove('hidden');msg.classList.toggle('error',bad)}function friendly(code){return({invalid_email:'Enter a valid email address.',password_too_short:'Use a password with at least 8 characters.',invalid_credentials:'That email or password does not match.',account_suspended:'This account is suspended. Please contact PupScene support.',password_setup_required:'This is a legacy account with protected history. Please contact PupScene support for verified account recovery.',server_error:'PupScene could not sign you in right now. Please try again.'})[code]||code||'Could not continue'}
$('continueBtn').onclick=async()=>{const email=$('email').value.trim().toLowerCase(),password=$('password').value,name=$('name').value.trim();if(!/^\S+@\S+\.\S+$/.test(email))return say('Enter a valid email address.',true);if(password.length<8)return say('Use at least 8 characters for your password.',true);$('continueBtn').disabled=true;$('continueBtn').textContent='Please wait…';try{const r=await fetch('/api/auth/email-access',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,password,name})});const j=await r.json();if(!r.ok)throw new Error(friendly(j.error));say(j.created?'Your PupScene account is ready. Opening the Studio…':'Signed in. Opening the Studio…');setTimeout(()=>location.href=next,250)}catch(e){say(e.message,true)}finally{$('continueBtn').disabled=false;$('continueBtn').textContent='Continue to PupScene'}};
$('showPass').onclick=()=>{const p=$('password'),show=p.type==='password';p.type=show?'text':'password';$('showPass').textContent=show?'Hide':'Show'};$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('continueBtn').click()});
</script></body></html>
