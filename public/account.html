<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6d7c7"><title>My Account — PupScene Studio</title><link rel="stylesheet" href="assets/account.css"><link rel="icon" href="assets/favicon-32.png"></head><body><div class="shell"><div class="top"><a class="brand" href="index.html"><img src="assets/app-logo.webp" alt=""><span>PupScene Studio</span></a><div class="actions"><a class="btn" href="index.html">← Studio</a><a class="btn hidden" id="adminLink" href="admin.html">Admin</a><button class="btn" id="logout">Sign out</button></div></div><section class="hero"><span class="badge">My Account</span><h1 id="title">Loading…</h1><p class="muted" id="email"></p></section><section class="grid"><div class="stat"><small>Plan</small><b id="plan">—</b></div><div class="stat"><small>Status</small><b id="status">—</b></div><div class="stat"><small>Storyboard credits</small><b id="credits">—</b></div><div class="stat"><small>Next renewal</small><b id="renewal">—</b></div></section><section class="card" style="margin-top:18px"><h2>Billing history</h2><div id="billMsg" class="muted">Loading…</div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Plan</th><th>Provider</th><th>Amount</th><th>Status</th></tr></thead><tbody id="billing"></tbody></table></div><div class="actions" style="margin-top:14px"><a class="btn peach" href="checkout.html">Buy / change plan</a></div></section></div><script>
const fmtDate=v=>v?new Date(Number(v)).toLocaleDateString():'—';async function boot(){const r=await fetch('/api/auth/me');if(r.status===401){location.href='login.html?next=account.html';return}const j=await r.json();const u=j.user;document.getElementById('title').textContent=u.name||'Your PupScene account';document.getElementById('email').textContent=u.email;document.getElementById('plan').textContent=u.plan==='five-monthly'?'5 Storyboard Generations / 30 days':u.plan==='unlimited-monthly'?'Unlimited / 30 days':'Free — 1 Storyboard Daily';document.getElementById('status').textContent=u.entitlementStatus;document.getElementById('credits').textContent=u.plan==='unlimited-monthly'?'Unlimited':u.plan==='free-daily'?'1 per day':String(u.creditsRemaining??0);document.getElementById('renewal').textContent=fmtDate(u.renewalAt||u.validUntil);if(u.isAdmin)document.getElementById('adminLink').classList.remove('hidden');const b=await fetch('/api/account/billing').then(x=>x.json()).catch(()=>({payments:[]}));const body=document.getElementById('billing');body.innerHTML=(b.payments||[]).map(p=>`<tr><td>${fmtDate(p.created_at)}</td><td>${p.plan}</td><td>${p.provider||'—'}</td><td>${p.amount_paid||p.amount_usd||0} ${p.currency||'USD'}</td><td>${p.status}</td></tr>`).join('');document.getElementById('billMsg').textContent=(b.payments||[]).length?'':'No billing records yet.'}document.getElementById('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='login.html'};boot();
</script></body></html>
